# Publishes index.html to GitHub Pages with liquidity-data.json refreshed every hour, and sends alerts to ntfy.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Alerts: add the repository secret NTFY_TOPIC and subscribe to that topic in the ntfy app (no secret, no alerts).
name: Pages

on:
  push:
    branches: [claude/btc-usdt-chart-dashboard-i92jp1]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site
          cp *.html _site/
          # data for index.html; the book history of the live site is carried forward
          python3 scripts/liquidity_snapshot.py _site --prev "${{ steps.pages.outputs.base_url }}/liquidity-data.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Send alerts
        # hourly runs only, so a push does not repeat the alerts of the last scheduled run
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 scripts/liquidity_alert.py _site/liquidity-data.json | tee alert.txt
          if [ -n "$NTFY_TOPIC" ] && grep -q '^MELDING:' alert.txt; then
            curl -sS --fail -H "Title: BTC Liquidity Map" -H "Click: ${{ steps.pages.outputs.base_url }}/" \
              --data-binary @alert.txt "https://ntfy.sh/$NTFY_TOPIC"
          fi
