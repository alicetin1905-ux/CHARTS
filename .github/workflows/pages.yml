# Publishes GlassSphere (index.html, installable on the iOS home screen) to GitHub Pages, with the data files
# (glasssphere-data.json for BTC, glasssphere-<asset>.json for the other assets) refreshed every
# hour, and sends alerts for each of them to ntfy.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Alerts: add the repository secret NTFY_TOPIC and subscribe to that topic in the ntfy app (no secret, no alerts).
name: GlassSphere

on:
  push:
    branches: [claude/btc-usdt-chart-dashboard-i92jp1]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site
          cp *.html manifest.webmanifest _site/ && cp -r icons _site/
          # data for index.html, one file per asset; the book history of the live site is carried forward
          # (liquidity-data.json is the BTC file's name before the rename to GlassSphere)
          base="${{ steps.pages.outputs.base_url }}"
          python3 scripts/glasssphere_snapshot.py _site --asset btc --prev "$base/glasssphere-data.json" --prev "$base/liquidity-data.json"
          for a in eth sol bnb xrp doge sui ena gala pepe wld near; do
            python3 scripts/glasssphere_snapshot.py _site --asset $a --prev "$base/glasssphere-$a.json"
          done
          # every asset's verdict in one small file, for the coin tiles on the start page
          python3 scripts/glasssphere_summary.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Send alerts
        # hourly runs only, so a push does not repeat the alerts of the last scheduled run
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # per coin on / off and the quiet hours are in alerts.json
        run: python3 scripts/glasssphere_notify.py _site "${{ steps.pages.outputs.base_url }}"
