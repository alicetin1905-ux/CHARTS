# Publishes the HTML pages to GitHub Pages, with liquidity-data.json for index.html refreshed every hour.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [claude/btc-usdt-chart-dashboard-i92jp1]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site
          cp *.html _site/
          # data for index.html; the book history of the live site is carried forward
          python3 scripts/liquidity_snapshot.py --site _site --prev "${{ steps.pages.outputs.base_url }}/liquidity-data.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
